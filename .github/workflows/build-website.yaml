name: Rebuild Cookbook Website

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Call Deploy Hook
        env:
          HOOK_URL: ${{ secrets.WEBSITE_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$HOOK_URL"
